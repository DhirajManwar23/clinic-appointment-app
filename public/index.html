<style>
  :root{
    --ink:#123832; --ink-soft:#3E5B54; --muted:#6B8079;
    --bg-top:#0E2B26; --bg-bottom:#1B4B43;

    --bot-bubble:#FFFFFF; --user-bubble:#DCEEE6; --user-bubble-border:#BFE0D1;
    --chip-border:#CFE3DA; --chip-bg:#F3FAF7;
    --danger:#D2483A;
    --shadow: 0 10px 30px rgba(14,43,38,0.18);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    min-height:100vh;
    background: radial-gradient(1200px 600px at 15% -10%, rgba(232,147,74,0.18), transparent 60%), linear-gradient(160deg, var(--bg-top), var(--bg-bottom));
    font-family:'Inter','Noto Sans Devanagari',sans-serif;
    display:flex; align-items:center; justify-content:center; padding:28px 14px;
  }
  .stage{ width:100%; max-width:420px; }
  .brand{ text-align:center; margin-bottom:14px; color:#EAF3EF; }
  .brand .mark{ display:inline-flex; align-items:center; gap:8px; font-family:'Poppins',sans-serif; font-weight:700; font-size:15px; color:#F4F8F6; }
  .brand .mark svg{ width:20px; height:20px; }
  .brand .sub{ font-size:12px; color:#B9D3C9; margin-top:2px; }
  .phone{ background:var(--paper); border-radius:26px; box-shadow:var(--shadow); overflow:hidden; display:flex; flex-direction:column; height:min(720px, 78vh); border:1px solid rgba(255,255,255,0.4); }
  .phone-header{ background:linear-gradient(135deg, var(--ink) 0%, #1E5349 100%); color:#fff; padding:16px 18px; display:flex; align-items:center; justify-content:space-between; flex-shrink:0; }
  .phone-header .who{ display:flex; align-items:center; gap:10px; }
  .avatar{ width:38px;height:38px;border-radius:50%; background:var(--accent); display:flex;align-items:center;justify-content:center; font-family:'Poppins',sans-serif; font-weight:700; color:#fff; font-size:15px; flex-shrink:0; }
  .who-text .name{ font-family:'Poppins',sans-serif; font-weight:600; font-size:14.5px; line-height:1.2; }
  .who-text .status{ font-size:11px; color:#B9D3C9; display:flex;align-items:center;gap:5px; margin-top:2px; }
  .who-text .status .dot{ width:6px;height:6px;border-radius:50%; background:#6BE6A6; display:inline-block; }
  .restart-btn{ background:rgba(255,255,255,0.12); border:1px solid rgba(255,255,255,0.25); color:#EAF3EF; font-size:11.5px; font-weight:600; padding:7px 11px; border-radius:20px; cursor:pointer; }
  .restart-btn:hover{ background:rgba(255,255,255,0.22); }
  .thread{ flex:1; overflow-y:auto; padding:18px 14px 10px; display:flex; flex-direction:column; gap:10px; background:#F6FAF8; }
  .thread::-webkit-scrollbar{ width:6px; }
  .thread::-webkit-scrollbar-thumb{ background:#CFE3DA; border-radius:10px; }
  .row{ display:flex; width:100%; }
  .row.bot{ justify-content:flex-start; }
  .row.user{ justify-content:flex-end; }
  .bubble{ max-width:82%; padding:10px 14px; border-radius:16px; font-size:14px; line-height:1.45; animation: pop .28s cubic-bezier(.2,.8,.3,1.1) both; box-shadow:0 1px 2px rgba(18,56,50,0.06); }
  @keyframes pop{ from{ opacity:0; transform:translateY(8px) scale(.97);} to{ opacity:1; transform:translateY(0) scale(1);} }
  .bubble.bot{ background:var(--bot-bubble); color:var(--ink); border:1px solid #E7EFEC; border-bottom-left-radius:4px; }
  .bubble.user{ background:var(--user-bubble); border:1px solid var(--user-bubble-border); color:var(--ink); border-bottom-right-radius:4px; font-weight:500; }
  .bubble.error{ background:#FDEDEB; border:1px solid #F3C6BF; color:var(--danger); }
  .typing{ display:flex; gap:4px; align-items:center; background:var(--bot-bubble); border:1px solid #E7EFEC; padding:12px 14px; border-radius:16px; border-bottom-left-radius:4px; width:fit-content; }
  .typing span{ width:6px;height:6px;border-radius:50%; background:#9DB6AE; animation: bounce 1.1s infinite ease-in-out; }
  .typing span:nth-child(2){ animation-delay:.15s; }
  .typing span:nth-child(3){ animation-delay:.3s; }
  @keyframes bounce{ 0%,60%,100%{ transform:translateY(0); opacity:.5;} 30%{ transform:translateY(-4px); opacity:1;} }
  .chips{ display:flex; flex-wrap:wrap; gap:8px; padding:2px 2px 6px; animation: pop .3s cubic-bezier(.2,.8,.3,1.1) both; }
  .chip{ font-size:13.5px; font-weight:600; color:var(--ink); background:var(--chip-bg); border:1.5px solid var(--chip-border); padding:9px 14px; border-radius:12px; cursor:pointer; transition: all .15s ease; display:flex; align-items:center; gap:6px; }
  .chip:hover:not(:disabled){ background:var(--accent-soft); border-color:var(--accent); transform:translateY(-1px); }
  .chip:disabled{ opacity:0.4; cursor:not-allowed; text-decoration:line-through; }
  .chip .lbl-sub{ font-size:11px; color:var(--muted); font-weight:500; }
  .chip.lang{ flex-direction:column; align-items:flex-start; gap:2px; min-width:108px; }
  .chip.lang .native{ font-size:15px; font-family:'Noto Sans Devanagari','Poppins',sans-serif; }
  .chip.day{ flex-direction:column; align-items:center; min-width:76px; padding:8px 10px; }
  .chip.day .dname{ font-size:12.5px; }
  .chip.day .ddate{ font-family:'JetBrains Mono',monospace; font-size:11px; font-weight:600; color:var(--accent-dark); margin-top:2px; }
  .chip.time{ font-family:'JetBrains Mono',monospace; font-weight:600; font-size:13px; background:#fff; border:1.5px dashed var(--chip-border); padding:8px 12px 8px 10px; position:relative; }
  .chip.time::before{ content:''; width:6px;height:6px; border-radius:50%; background:var(--accent); display:inline-block; flex-shrink:0; }
  .chip.time:hover:not(:disabled){ border-style:solid; }
  .menu-chip{ flex-direction:column; align-items:flex-start; min-width:150px; gap:1px; }
  .menu-chip .m-title{ font-size:14px; }
  .menu-chip .m-icon{ font-size:16px; margin-right:4px; }
  .composer{ flex-shrink:0; padding:10px 14px 14px; background:#fff; border-top:1px solid #EDF2F0; }
  .composer-inner{ display:flex; align-items:center; gap:8px; background:#F1F6F4; border-radius:22px; padding:9px 14px; color:var(--muted); font-size:12.5px; }
  .composer-form{ display:flex; gap:8px; }
  .composer-form input, .composer-form textarea{
    flex:1; border:1px solid var(--chip-border); border-radius:18px; padding:9px 14px; font-size:13.5px; font-family:inherit; outline:none; resize:none;
  }
  .composer-form input:focus, .composer-form textarea:focus{ border-color:var(--accent); }
  .composer-form button{ background:var(--accent); color:#fff; border:none; border-radius:18px; padding:0 16px; font-weight:700; font-size:13px; cursor:pointer; }
  .composer-form button:hover{ background:var(--accent-dark); }
  .summary-card{ background:linear-gradient(135deg, #FFFDF9, #FFF6EB); border:1px solid var(--accent-soft); border-radius:14px; padding:14px 16px; max-width:88%; box-shadow:0 1px 2px rgba(18,56,50,0.06); animation: pop .3s cubic-bezier(.2,.8,.3,1.1) both; }
  .summary-card .s-head{ display:flex; align-items:center; gap:8px; font-family:'Poppins',sans-serif; font-weight:700; font-size:14px; color:var(--accent-dark); margin-bottom:8px; }
  .summary-card .s-row{ display:flex; justify-content:space-between; font-size:13px; padding:5px 0; border-bottom:1px dashed #EAD9BE; color:var(--ink); gap:10px; }
  .summary-card .s-row:last-child{ border-bottom:none; }
  .summary-card .s-row .k{ color:var(--muted); font-weight:500; flex-shrink:0; }
  .summary-card .s-row .v{ font-weight:700; font-family:'JetBrains Mono',monospace; font-size:12.5px; text-align:right; }
  @media (max-width:420px){ .stage{ max-width:100%; } .phone{ height:86vh; border-radius:20px; } }
</style>

};

let state = { lang:null, service:null, serviceTitle:null, day:null, date:null, time:null, name:null, phone:null, holdToken:null };

function scrollDown(){ requestAnimationFrame(()=>{ thread.scrollTop = thread.scrollHeight; }); }

function addBotBubble(text, delay=420){
  return new Promise(resolve=>{
    const typingRow = document.createElement('div');
    typingRow.className = 'row bot';
    typingRow.innerHTML = `<div class="typing"><span></span><span></span><span></span></div>`;
    thread.appendChild(typingRow);
    scrollDown();
    setTimeout(()=>{
      typingRow.remove();
      const row = document.createElement('div');
      row.className = 'row bot';
      row.innerHTML = `<div class="bubble bot">${text}</div>`;
      thread.appendChild(row);
      scrollDown();
      resolve();
    }, delay);
  });
}
function addErrorBubble(text){
  const row = document.createElement('div');
  row.className = 'row bot';
  row.innerHTML = `<div class="bubble error">⚠️ ${text}</div>`;
  thread.appendChild(row);
  scrollDown();
}
function addUserBubble(text){
  const row = document.createElement('div');
  row.className = 'row user';
  row.innerHTML = `<div class="bubble user">${text}</div>`;
  thread.appendChild(row);
  scrollDown();
}
function addChips(chips, onPick){
  const row = document.createElement('div');
  row.className = 'row bot';
  const wrap = document.createElement('div');
  wrap.className = 'chips';
  chips.forEach(c=>{
    const btn = document.createElement('button');
    btn.className = 'chip ' + (c.cls||'');
    btn.innerHTML = c.html;
    if (c.disabled) btn.disabled = true;
    btn.onclick = ()=>{
      wrap.querySelectorAll('.chip').forEach(b=> b.disabled = true);
      wrap.style.opacity = '0.5'; wrap.style.pointerEvents = 'none';
      onPick(c);
    };
    wrap.appendChild(btn);
  });
  row.appendChild(wrap);
  thread.appendChild(row);
  scrollDown();
}
function setComposerIdle(){
  composer.innerHTML = `<div class="composer-inner">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M12 2v20M2 12h20" stroke="#9DB6AE" stroke-width="1.6" stroke-linecap="round"/></svg>
    Tap an option above to reply
  </div>`;
}
function setComposerInput({ placeholder, buttonLabel, multiline=false, onSubmit }){
  composer.innerHTML = `<form class="composer-form" id="cform">
    ${multiline
      ? `<textarea id="cinput" rows="1" placeholder="${placeholder}"></textarea>`
      : `<input id="cinput" type="text" placeholder="${placeholder}" autocomplete="off" />`}
    <button type="submit">${buttonLabel}</button>
  </form>`;
  const form = document.getElementById('cform');
  const input = document.getElementById('cinput');
  input.focus();
  form.onsubmit = (e)=>{
    e.preventDefault();
    const val = input.value.trim();
    onSubmit(val);
  };
}
function addSummaryCard(t, opts){
  const row = document.createElement('div');
  row.className = 'row bot';
  row.innerHTML = `<div class="summary-card">
      <div class="s-head">✅ ${opts.title}</div>
      ${opts.rows.map(r=>`<div class="s-row"><span class="k">${r.k}</span><span class="v">${r.v}</span></div>`).join('')}
    </div>`;
  thread.appendChild(row);
  scrollDown();
}

async function api(path, options={}){
  const res = await fetch(API + path, {
    headers: { 'Content-Type': 'application/json' },
    ...options,
  });
  const data = await res.json().catch(()=>({}));
  if (!res.ok) {
    const err = new Error(data.error || 'Request failed');
    err.code = data.code || null;
    throw err;
  }
  return data;
}

// ---------- Flow ----------
async function startFlow(){
  thread.innerHTML = '';
  setComposerIdle();
  state = { lang:null, service:null, serviceTitle:null, day:null, date:null, time:null, name:null, phone:null, holdToken:null };
  await addBotBubble(T.en.greet, 300);
  addChips(
    LANGS.map(l => ({ cls:'lang', html:`<span class="native">${l.native}</span><span class="lbl-sub">${l.label}</span>`, lang:l })),
    (chosen)=> handleLanguage(chosen.lang)
  );
}

async function handleLanguage(lang){
  state.lang = lang.code;
  addUserBubble(lang.native);
  const t = T[lang.code];
  await addBotBubble(t.menuPrompt);
  addChips(
    t.menu.map(m => ({ cls:'menu-chip', html:`<span class="m-title"><span class="m-icon">${m.icon}</span>${m.title}</span><span class="lbl-sub">${m.sub}</span>`, item:m })),
    (chosen)=> handleMenu(chosen.item, t)
  );
}

async function handleMenu(item, t){
  state.service = item.key;
  state.serviceTitle = item.title;
  addUserBubble(`${item.icon} ${item.title}`);

  if (item.key === 'offline'){
    await addBotBubble(t.dayPrompt);
    try{
      const { days } = await api('/api/public/days');
      const chips = days.map(d => ({
        cls:'day',
        html:`<span class="dname">${t.days[d.dayName]}</span><span class="ddate">${d.displayDate}</span>`,
        day:d.dayName, date:d.date
      }));
      addChips(chips, (chosen)=> handleDay(chosen, t));
    } catch(e){ addErrorBubble(t.genericErr); }
  } else if (item.key === 'medicine'){
    await addBotBubble(t.loadingMedicines, 250);
    try{
      const { medicines } = await api('/api/public/medicines');
      if (!medicines.length){
        await addBotBubble(t.noMedicines, 150);
        addRestartLink(t);
        return;
      }
      await addBotBubble(t.medicinePrompt, 150);
      const chips = medicines.map(m => ({
        cls:'menu-chip',
        html:`<span class="m-title">💊 ${escapeHtml(m.name)}</span><span class="lbl-sub">${m.qty > 0 ? t.inStock(m.qty) : t.outOfStock}${m.price ? ' · ' + escapeHtml(m.price) : ''}</span>`,
        medicine:m, disabled: m.qty <= 0,
      }));
      addChips(chips, (chosen)=> handleMedicinePick(chosen.medicine, t));
    } catch(e){ addErrorBubble(t.genericErr); }
  } else {
    await addBotBubble(t.askName);
    setComposerInput({
      placeholder: t.namePh, buttonLabel: t.send,
      onSubmit: (val)=>{ if(!val) return; state.name = val; addUserBubble(val); setComposerIdle(); askPhoneForRequest(t, item); }
    });
  }
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

async function handleMedicinePick(medicine, t){
  state.medicine = medicine;
  addUserBubble(`💊 ${medicine.name}`);
  await addBotBubble(t.askQty(medicine.name));
  setComposerInput({
    placeholder: t.qtyPh, buttonLabel: t.send,
    onSubmit: (val)=>{
      const n = parseInt(val, 10);
      if (!val || !Number.isInteger(n) || n < 1){
        addErrorBubble(t.invalidQty);
        return;
      }
      state.qty = n;
      addUserBubble(String(n));
      setComposerIdle();
      askNameForMedicine(t);
    }
  });
}

async function askNameForMedicine(t){
  await addBotBubble(t.askName);
  setComposerInput({
    placeholder: t.namePh, buttonLabel: t.send,
    onSubmit: (val)=>{ if(!val) return; state.name = val; addUserBubble(val); setComposerIdle(); askPhoneForMedicine(t); }
  });
}

async function askPhoneForMedicine(t){
  await addBotBubble(t.askPhone);
  setComposerInput({
    placeholder: t.phonePh, buttonLabel: t.send,
    onSubmit: async (val)=>{
      if(!val) return;
      state.phone = val; addUserBubble(val); setComposerIdle();
      try{
        const { order } = await api('/api/public/medicine-orders', {
          method:'POST',
          body: JSON.stringify({
            patientName: state.name, patientPhone: state.phone, language: state.lang,
            medicineId: state.medicine.id, quantity: state.qty,
          })
        });
        await addBotBubble(t.medicineOrderMsg, 500);
        addSummaryCard(t, { title: t.medicineOrderTitle, rows: [
          { k: t.labels.medicine, v: state.medicine.name },
          { k: t.labels.qty, v: String(state.qty) },
          { k: t.labels.name, v: state.name },
          { k: t.labels.phone, v: state.phone },
          { k: t.labels.ref, v: '#M' + order.id },
        ]});
        addRestartLink(t);
      } catch(e){ addErrorBubble(t.genericErr); }
    }
  });
}

async function askPhoneForRequest(t, item){
  await addBotBubble(t.askPhone);
  setComposerInput({
    placeholder: t.phonePh, buttonLabel: t.send,
    onSubmit: (val)=>{ if(!val) return; state.phone = val; addUserBubble(val); setComposerIdle(); askMessageForRequest(t, item); }
  });
}

async function askMessageForRequest(t, item){
  await addBotBubble(t.askMessage(item.title));
  setComposerInput({
    placeholder: t.msgPh, buttonLabel: t.send, multiline:true,
    onSubmit: async (val)=>{
      addUserBubble(val || '—');
      setComposerIdle();
      try{
        const { request } = await api('/api/public/requests', {
          method:'POST',
          body: JSON.stringify({ patientName: state.name, patientPhone: state.phone, language: state.lang, type: item.key, message: val })
        });
        await addBotBubble(t.requestMsg, 500);
        addSummaryCard(t, { title: t.requestTitle, rows: [
          { k: t.labels.service, v: item.title },
          { k: t.labels.name, v: state.name },
          { k: t.labels.phone, v: state.phone },
          { k: t.labels.ref, v: '#R' + request.id },
        ]});
        addRestartLink(t);
      } catch(e){ addErrorBubble(t.genericErr); }
    }
  });
}

async function handleDay(chosen, t){
  state.day = chosen.day;
  state.date = chosen.date;
  addUserBubble(`${t.days[chosen.day]}, ${chosen.date}`);
  await addBotBubble(t.loadingSlots, 250);
  try{
    const { slots } = await api('/api/public/slots?date=' + encodeURIComponent(chosen.date));
    await addBotBubble(t.timePrompt(t.days[chosen.day]), 150);
    const chips = slots.map(s => ({ cls:'time', html:s.time, time:s.time, disabled: s.booked || s.held }));
    addChips(chips, (c)=> handleTime(c, t, chosen));
  } catch(e){ addErrorBubble(t.genericErr); }
}

async function handleTime(c, t, chosen){
  addUserBubble(c.time);
  try{
    const hold = await api('/api/public/slots/hold', {
      method:'POST',
      body: JSON.stringify({ date: state.date, timeSlot: c.time })
    });
    state.time = c.time;
    state.holdToken = hold.holdToken;
    await addBotBubble(t.slotHeld(c.time), 300);
    await addBotBubble(t.askName);
    setComposerInput({
      placeholder: t.namePh, buttonLabel: t.send,
      onSubmit: (val)=>{ if(!val) return; state.name = val; addUserBubble(val); setComposerIdle(); askPhoneForAppointment(t); }
    });
  } catch(e){
    if (e.code === 'SLOT_UNAVAILABLE'){
      addErrorBubble(t.slotTakenErr);
      handleDay(chosen, t); // refresh the slot list so they can pick another
    } else {
      addErrorBubble(t.genericErr);
    }
  }
}

async function askPhoneForAppointment(t){
  await addBotBubble(t.askPhone);
  setComposerInput({
    placeholder: t.phonePh, buttonLabel: t.send,
    onSubmit: async (val)=>{
      if(!val) return;
      state.phone = val; addUserBubble(val); setComposerIdle();
      try{
        const { appointment } = await api('/api/public/appointments', {
          method:'POST',
          body: JSON.stringify({
            patientName: state.name, patientPhone: state.phone, language: state.lang,
            date: state.date, timeSlot: state.time, holdToken: state.holdToken
          })
        });
        state.holdToken = null; // slot is booked now, nothing left to release
        await addBotBubble(t.confirmMsg, 500);
        addSummaryCard(t, { title: t.confirmTitle, rows: [
          { k: t.labels.language, v: LANGS.find(l=>l.code===state.lang).native },
          { k: t.labels.service, v: state.serviceTitle },
          { k: t.labels.day, v: `${t.days[state.day]}, ${state.date}` },
          { k: t.labels.time, v: state.time },
          { k: t.labels.name, v: state.name },
          { k: t.labels.phone, v: state.phone },
          { k: t.labels.ref, v: '#A' + appointment.id },
        ]});
        addRestartLink(t);
      } catch(e){
        addErrorBubble(e.code === 'SLOT_UNAVAILABLE' ? t.slotTakenErr : t.genericErr);
      }
    }
  });
}

function releaseHoldIfAny(){
  if (state.holdToken && state.date && state.time){
    // best-effort, don't block the UI on this
    api('/api/public/slots/hold', {
      method:'DELETE',
      body: JSON.stringify({ date: state.date, timeSlot: state.time, holdToken: state.holdToken })
    }).catch(()=>{});
  }
}

function addRestartLink(t){
  const row = document.createElement('div');
  row.className = 'row bot';
  row.innerHTML = `<div style="padding:4px 2px;"><a href="#" id="restartLink" style="color:var(--accent-dark);font-weight:600;text-decoration:none;font-size:13px;">↺ ${t.changeLink}</a></div>`;
  thread.appendChild(row);
  scrollDown();
  document.getElementById('restartLink').onclick = (e)=>{ e.preventDefault(); startFlow(); };
}

restartBtn.onclick = ()=>{ releaseHoldIfAny(); startFlow(); };
window.addEventListener('beforeunload', releaseHoldIfAny);
startFlow();
</script>
